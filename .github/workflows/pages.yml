# Publishes the page that is already committed at the repository root.
#
# index.html is self-contained — three.js, the fonts and every model are inlined at build time — so there is nothing
# to compile here. Rebuilding it needs the `simulator` skill's kit, which is not a public npm package, so the build
# runs on a developer's machine (`npm run build`) and the result is committed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect the page and its screenshots
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          if [ -d docs ]; then cp -r docs _site/docs; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
